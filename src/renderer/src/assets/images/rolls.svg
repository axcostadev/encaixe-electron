<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <!-- Glyph rolls: two base rolls and one on top, solid red with white outlines and inner circles -->
  <defs>
    <style> .r-fill{fill:#a01830;} .r-stroke{stroke:#ffffff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:#a01830;} </style>
  </defs>

  <!-- Bottom-left roll -->
  <g class="r-stroke">
    <ellipse cx="20" cy="44" rx="12" ry="6" />
    <rect x="8" y="38" width="24" height="12" rx="6" />
  </g>
  <!-- Bottom-right roll -->
  <g class="r-stroke">
    <ellipse cx="44" cy="44" rx="12" ry="6" />
    <rect x="32" y="38" width="24" height="12" rx="6" />
  </g>

  <!-- Top roll (centered above base rolls) -->
  <g class="r-stroke">
    <ellipse cx="32" cy="26" rx="14" ry="7" />
    <rect x="18" y="20" width="28" height="12" rx="6" />
  </g>

  <!-- Inner end-circles (white fill, red inner) to emphasize cylindrical ends -->
  <g>
    <ellipse cx="9" cy="44" rx="4" ry="5" fill="#ffffff" />
    <ellipse cx="9" cy="44" rx="2" ry="2.6" fill="#a01830" />

    <ellipse cx="31" cy="44" rx="4" ry="5" fill="#ffffff" />
    <ellipse cx="31" cy="44" rx="2" ry="2.6" fill="#a01830" />

    <ellipse cx="53" cy="44" rx="4" ry="5" fill="#ffffff" />
    <ellipse cx="53" cy="44" rx="2" ry="2.6" fill="#a01830" />

    <ellipse cx="32" cy="26" rx="6" ry="3" fill="#ffffff" />
    <ellipse cx="32" cy="26" rx="2.6" ry="1.3" fill="#a01830" />
  </g>

  <!-- Small unrolled tail on top-left of the upper roll (white with red inner line) -->
  <path d="M22 20 C18 18, 15 16, 18 14 C21 12, 25 14, 24 17 C23 19, 22 20, 22 20 Z" fill="#ffffff" stroke="#a01830" stroke-width="1"/>

</svg>